[workspace]
resolver = "2"
members = ["crates/aic-core", "crates/aic-sim", "crates/aic-wasm", "crates/aic-farm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
aic-core = { path = "crates/aic-core" }
# `rc`: the state shares its config and a pending choice's snapshot through
# `Arc` (cheap clones for search); they serialize as the plain value.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rand = { version = "0.8", default-features = false }
rand_chacha = { version = "0.3", default-features = false, features = ["serde1"] }

# Tests play whole games, which unoptimized code runs many times slower. The test
# build is optimized but keeps debug assertions and overflow checks (inherited
# from dev).
[profile.test]
opt-level = 1

[profile.release.package.aic-wasm]
opt-level = "s"

# For long screens: 8% faster than release (030), for a build of minutes rather
# than seconds. `cargo build --profile fast -p aic-sim`: target/fast/aic-sim.
[profile.fast]
inherits = "release"
lto = "fat"
codegen-units = 1
