[package]
name = "aic-sim"
description = "Native CLI: seeded simulation sweeps and config comparisons for AI Complete"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aic-core.workspace = true
serde.workspace = true
# Exact f64s when a stopped run's games.jsonl is read back (--resume).
serde_json = { workspace = true, features = ["float_roundtrip"] }
rand.workspace = true
rand_chacha.workspace = true
mimalloc = { version = "0.1.52", default-features = false }

[features]
# Times the search's hot calls; `experiment` prints the split (src/prof.rs).
profile = []

# Refuses a test run whose flags became a filter: see the file.
[[test]]
name = "args_guard"
harness = false
