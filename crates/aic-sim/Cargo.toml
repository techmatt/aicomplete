[package]
name = "aic-sim"
description = "Native CLI: seeded simulation sweeps and config comparisons for AI Complete"
version.workspace = true
edition.workspace = true
license.workspace = true

# No doc comment holds a doctest; the empty doctest pass cost ~1 s a crate in the fast lane (232).
[lib]
doctest = false

[dependencies]
aic-core.workspace = true
serde.workspace = true
# Exact f64s when a stopped run's games.jsonl is read back (--resume).
serde_json = { workspace = true, features = ["float_roundtrip"] }
rand.workspace = true
rand_chacha.workspace = true
# 160: the float functions as wasm computes them, behind the `libm` flag (src/fmath.rs).
libm = { version = "0.2", optional = true }

# wasm (the farm's bundle, crates/aic-farm) keeps its own allocator.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[features]
# Times the search's hot calls; `experiment` prints the split (src/prof.rs).
profile = []
# 160: native float functions from the `libm` crate, as on wasm; not the default (src/fmath.rs).
libm = ["dep:libm"]

# Refuses a test run whose flags became a filter: see the file.
[[test]]
name = "args_guard"
harness = false
