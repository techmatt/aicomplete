<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Complete: cards</title>
  <link rel="stylesheet" href="card/card.css">
  <link rel="stylesheet" href="cards/viewer.css">
</head>
<body>
  <header>
    <div class="bar">
      <h1>Cards</h1>
      <span id="count"></span>
      <input id="search" type="search" placeholder="Search name, text, id, note…">
      <label>Sort <select id="sort"></select></label>
      <button id="dir" title="Reverse the sort">↑</button>
      <label>View <select id="view"><option value="grid">Cards</option><option value="table">Table</option></select></label>
      <label id="zoom-box">Size <input id="zoom" type="range" min="0.4" max="1.2" step="0.05" value="0.6"></label>
      <label id="agent-box">Stats <select id="agent"></select></label>
      <button id="seen-all" title="Clear every new badge">Mark all seen</button>
      <button id="rebuild" title="Export again from this checkout">Rebuild</button>
      <span id="status"></span>
    </div>
    <div class="bar filters">
      <div class="chips" id="kinds"></div>
      <div class="chips" id="tags"></div>
      <div class="chips" id="tiers"></div>
      <label>Cost <input id="cost-min" type="number" min="0" placeholder="min"> – <input id="cost-max" type="number" min="0" placeholder="max"></label>
      <label>Keyword <select id="keyword"></select></label>
      <label>Review <select id="review"></select></label>
      <button id="clear">Clear filters</button>
    </div>
    <div id="notice"></div>
  </header>
  <main id="cards"></main>
  <dialog id="detail"></dialog>
  <script type="module" src="cards/viewer.js"></script>
</body>
</html>
