<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Complete: printed faces</title>
  <link rel="stylesheet" href="card/card.css">

  <style>
    body { margin: 0; background: #20242b; color: #e8ebef; font: 14px system-ui, sans-serif; }
    header { padding: 10px 18px; display: flex; gap: 18px; align-items: baseline; }
    header a { color: #9cc3ff; }
    h2 { margin: 18px 18px 8px; font: 600 18px 'Saira Condensed', sans-serif; letter-spacing: .04em; }

    .trim { width: 63mm; height: 88mm; overflow: hidden; border-radius: 3mm; position: relative; background: #000; box-shadow: 0 1px 6px #0008; }

    #status { color: #f0b070; }
  </style>
